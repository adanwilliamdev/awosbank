name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissões globais atualizadas para suportar o Dependabot
permissions:
  contents: read
  packages: write # Necessário para o GITHUB_TOKEN publicar no ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/awosbank

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build + testes unitários e de integração (inclui Testcontainers/PostgreSQL)
  # ---------------------------------------------------------------------------
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # ADICIONADO: Permite o upload de artefatos pelo Dependabot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # O runner do GitHub já traz Docker, então PostgresMigrationTest roda de verdade.
      - name: mvn verify
        run: mvn -B verify

      - name: Publica relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Smoke test: sobe o docker compose (app + PostgreSQL) e confere os endpoints
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Sobe a stack e espera ficar saudável
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verifica health, login e Swagger
        run: |
          curl --fail --silent --show-error http://localhost:8080/actuator/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/login
          curl --fail --silent --show-error http://localhost:8080/v3/api-docs | grep -q '"/api/transferencia"'

      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3) CD: publica a imagem no GitHub Container Registry (somente main e tags v*)
  # ---------------------------------------------------------------------------
  publish:
    name: Publica imagem Docker
    runs-on: ubuntu-latest
    needs: [test, docker-smoke]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
