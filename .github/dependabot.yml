version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # O projeto roda em Java 17 (pom.xml) e Spring Boot 3.2.x: não deixe o Dependabot trocar a versão do JDK/JRE
    # na imagem (ex.: eclipse-temurin 17 -> 25). Atualizações de patch continuam normais.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
