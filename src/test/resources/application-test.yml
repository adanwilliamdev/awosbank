# Perfil dos testes rápidos: H2 em memória, schema criado pelo Hibernate (Flyway desligado).
# As migrations em PostgreSQL de verdade são exercitadas por PostgresMigrationIT (Testcontainers).
# LOCK_TIMEOUT alto para os testes de concorrência (threads esperando o SELECT ... FOR UPDATE).
spring:
  datasource:
    url: jdbc:h2:mem:awosbank-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  # Testes rápidos (H2, sem Flyway, sem tabelas SPRING_SESSION): sessão em memória, como antes.
  # (spring.session.store-type foi removida no Spring Boot 3, por isso a exclusão da auto-configuração.)
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

springdoc:
  api-docs:
    enabled: true

# Os testes fazem dezenas de logins/chamadas do mesmo IP (127.0.0.1): o rate limit fica desligado aqui e é
# exercitado à parte (RateLimitIntegrationTest liga com limites pequenos).
awosbank:
  seguranca:
    rate-limit:
      habilitado: false
