spring:
  application:
    name: awosbank-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # PostgreSQL em todos os perfis (suba com `docker compose up -d db`).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awosbank}
    username: ${DB_USERNAME:awosbank}
    password: ${DB_PASSWORD:awosbank}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # O schema é de responsabilidade do Flyway (src/main/resources/db/migration).
      # "validate" faz a aplicação falhar no boot se uma entidade divergir das migrations.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  # Atrás de proxy reverso/load balancer use "framework" para registrar o IP real do cliente na auditoria.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  packages-to-scan: com.awosbank.api.controller.api
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true      # envia o X-XSRF-TOKEN automaticamente nos "Try it out"
    operations-sorter: alpha
    tags-sorter: alpha

---
# =========== DEV (dados de demonstração, cookies sem "secure" para rodar em http://localhost) ===========
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}

---
# =========== PROD — segredos SOMENTE por variável de ambiente (sem valor padrão: falha rápido) ===========
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
      timeout: 15m
