spring:
  application:
    name: awosbank-api
  profiles:
    active: dev
  thymeleaf:
    cache: false

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

---
# =========== DEV (H2) ===========
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:awosbank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

---
# =========== PROD (PostgreSQL) ===========
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/awosbank
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect