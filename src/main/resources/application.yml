spring:
  application:
    name: awosbank-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # PostgreSQL em todos os perfis (suba com `docker compose up -d db`).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awosbank}
    username: ${DB_USERNAME:awosbank}
    password: ${DB_PASSWORD:awosbank}
    driver-class-name: org.postgresql.Driver
    # Pool pequeno: em ambiente serverless cada instância abre o próprio pool e bancos gerenciados
    # (Neon, Supabase) têm limite de conexões. Ajuste por variável se precisar.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 600000
  # Sessão guardada no banco (tabelas criadas pela migration V6)
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  jpa:
    hibernate:
      # O schema é de responsabilidade do Flyway (src/main/resources/db/migration).
      # "validate" faz a aplicação falhar no boot se uma entidade divergir das migrations.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Bloqueio temporário contra força bruta (login e senha de confirmação das operações)
awosbank:
  seguranca:
    max-tentativas: ${SEGURANCA_MAX_TENTATIVAS:5}     # falhas dentro da janela que disparam o bloqueio
    janela-minutos: ${SEGURANCA_JANELA_MINUTOS:15}    # as falhas só contam dentro desta janela
    bloqueio-minutos: ${SEGURANCA_BLOQUEIO_MINUTOS:15}
    # Rate limit por IP (em memória, janela deslizante). Recusados: 429 na API; nos formulários, volta à tela com aviso.
    rate-limit:
      habilitado: ${RATE_LIMIT_HABILITADO:true}
      max-autenticacao: ${RATE_LIMIT_MAX_AUTENTICACAO:10}   # POST /login e POST /cadastro por IP, por janela
      max-api: ${RATE_LIMIT_MAX_API:120}                    # /api/** por IP, por janela
      janela-segundos: ${RATE_LIMIT_JANELA_SEGUNDOS:60}

server:
  # A plataforma injeta PORT (no Vercel, defina PORT=8080 nas variáveis do projeto)
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
  # Atrás de proxy reverso/load balancer use "framework" para registrar o IP real do cliente na auditoria.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

# Tempo para encerrar requisições em andamento quando o Vercel envia SIGTERM (grace period de 30 s)
spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  packages-to-scan: com.awosbank.api.controller.api
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true      # envia o X-XSRF-TOKEN automaticamente nos "Try it out"
    operations-sorter: alpha
    tags-sorter: alpha

---
# =========== DEV (dados de demonstração, cookies sem "secure" para rodar em http://localhost) ===========
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}

---
# =========== PROD — segredos SOMENTE por variável de ambiente (sem valor padrão: falha rápido) ===========
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # O Vercel termina o HTTPS e repassa X-Forwarded-*: sem isso o IP da auditoria/rate limit seria o do proxy
  # e os redirects sairiam como http://
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
      timeout: 15m
