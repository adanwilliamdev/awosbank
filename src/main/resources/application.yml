spring:
  application:
    name: awosbank-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

---
# =========== DEV (H2 em memória) ===========
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:mem:awosbank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

---
# =========== PROD (PostgreSQL) — segredos SOMENTE por variável de ambiente ===========
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awosbank}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # TODO: trocar por "validate" quando o schema passar a ser gerenciado por Flyway
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
      timeout: 15m
