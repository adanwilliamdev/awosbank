<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width:560px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="fw-bold text-primary mb-1">Criar conta</h4>
            <p class="text-muted small mb-4">É rápido e seguro.</p>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>

            <form th:action="@{/cadastro}" th:object="${cadastroDTO}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" th:field="*{nomeCompleto}" class="form-control"
                           th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nomeCompleto}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">CPF ou CNPJ</label>
                    <input type="text" th:field="*{cpfCnpj}" class="form-control"
                           th:classappend="${#fields.hasErrors('cpfCnpj')} ? 'is-invalid'"
                           placeholder="Somente números">
                    <div class="invalid-feedback" th:errors="*{cpfCnpj}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" th:field="*{senha}" class="form-control"
                               th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{senha}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmar senha</label>
                        <input type="password" th:field="*{confirmarSenha}" class="form-control"
                               th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de conta</label>
                    <select th:field="*{tipoConta}" class="form-select"
                            th:classappend="${#fields.hasErrors('tipoConta')} ? 'is-invalid'">
                        <option value="">Selecione...</option>
                        <option th:each="t : ${tiposConta}" th:value="${t}" th:text="${t.descricao}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{tipoConta}"></div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Criar conta</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Já tem conta? <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
