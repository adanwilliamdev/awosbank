<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container" style="max-width:420px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">🏦 AWOS Bank</h3>
                <p class="text-muted mb-0">Acesse sua conta</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2">Email ou senha inválidos.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2">Logout realizado.</div>
            <div th:if="${sucesso}" class="alert alert-success py-2" th:text="${sucesso}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                Não tem conta?
                <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </div>
    </div>
    <p class="text-center text-muted small mt-3 mb-0">
        Teste: <code>cliente@awosbank.com</code> / <code>123456</code>
    </p>
</div>
</body>
</html>
