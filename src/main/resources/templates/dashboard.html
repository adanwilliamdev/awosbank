<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🏦 AWOS Bank</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small" th:text="${usuario.nomeCompleto}"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-outline-light">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card card-saldo text-white shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <small class="opacity-75">Saldo disponível</small>
                            <h2 class="mt-2 mb-0" id="saldo"
                                th:attr="data-real=${@formatador.moeda(conta.saldo)}"
                                th:text="${@formatador.moeda(conta.saldo)}">R$ 0,00</h2>
                        </div>
                        <button class="btn btn-sm btn-light" onclick="toggleSaldo()">👁️</button>
                    </div>
                    <hr class="border-light opacity-25">
                    <small>Ag. <span th:text="${conta.agencia}"></span> · Conta
                        <span th:text="${conta.numeroConta}"></span> ·
                        <span th:text="${conta.tipoConta.descricao}"></span>
                    </small>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h6 class="text-muted">Ações rápidas</h6>
                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <a th:href="@{/transferencia}" class="btn btn-outline-primary w-100">💸 Transferir</a>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/extrato}" class="btn btn-outline-secondary w-100">📄 Extrato</a>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-success w-100" data-bs-toggle="modal" data-bs-target="#modalDeposito">➕ Depositar</button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-warning w-100" data-bs-toggle="modal" data-bs-target="#modalSaque">➖ Sacar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between mb-3">
                <h5 class="mb-0">Últimas movimentações</h5>
                <a th:href="@{/extrato}" class="small">Ver extrato completo</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th class="text-end">Valor</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(ultimas)}">
                        <td colspan="5" class="text-center text-muted py-3">Nenhuma movimentação ainda.</td>
                    </tr>
                    <tr th:each="v : ${ultimas}">
                        <td th:text="${#temporals.format(v.transacao.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${v.descricao}"></td>
                        <td th:text="${v.transacao.tipo.descricao}"></td>
                        <td class="text-end fw-bold"
                            th:classappend="${v.entrada} ? 'text-success' : 'text-danger'">
                            <span th:text="${v.entrada} ? '+ ' : '- '"></span>
                            <span th:text="${@formatador.moeda(v.transacao.valor)}"></span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-link"
                               th:href="@{'/comprovante/' + ${v.transacao.comprovanteCodigo}}">comprovante</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Depósito -->
<div class="modal fade" id="modalDeposito" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/deposito}" method="post" class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Depositar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">Valor</label>
                <input type="number" step="0.01" min="0.01" name="valor" class="form-control" required>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-success">Depositar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Saque -->
<div class="modal fade" id="modalSaque" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/saque}" method="post" class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Sacar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">Valor</label>
                <input type="number" step="0.01" min="0.01" name="valor" class="form-control" required>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-warning">Sacar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleSaldo() {
        const el = document.getElementById('saldo');
        const real = el.getAttribute('data-real');
        const oculto = el.getAttribute('data-oculto') === 'true';
        el.textContent = oculto ? real : '••••••';
        el.setAttribute('data-oculto', !oculto);
    }
</script>
</body>
</html>
