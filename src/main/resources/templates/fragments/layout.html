<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- NAVBAR -->
<nav th:fragment="navbar(usuario, active)"
     class="navbar navbar-expand-lg navbar-awos">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <span th:replace="~{fragments/layout :: logo(36)}"></span>
            <span class="d-flex flex-column">
                <span class="brand-text">AWOS<span class="brand-sub">BANK</span></span>
                <span class="brand-edition">PORTFOLIO EDITION</span>
            </span>
        </a>
        <button class="navbar-toggler" aria-label="Menu" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active=='dashboard'}?'active fw-bold':''"
                       th:href="@{/dashboard}"><i class="bi bi-house-door-fill"></i> Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active=='extrato'}?'active fw-bold':''"
                       th:href="@{/extrato}"><i class="bi bi-receipt-cutoff"></i> Extrato</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active=='pix'}?'active fw-bold':''"
                       th:href="@{/pix}"><i class="bi bi-qr-code-scan"></i> PIX</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active=='perfil'}?'active fw-bold':''"
                       th:href="@{/perfil}"><i class="bi bi-person-fill"></i> Perfil</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="status-pill d-none d-xl-inline-flex"><span class="status-dot"></span>status: online</span>
                <div class="dropdown notification-wrapper" th:attr="data-usuario=${usuario.id}">
                    <button type="button" class="notification-btn" id="notificacaoBtn" title="Notificações"
                            aria-label="Notificações" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                            aria-expanded="false">
                        <i class="bi bi-bell-fill"></i>
                        <span class="badge-dot" hidden></span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu" aria-labelledby="notificacaoBtn">
                        <div class="notification-header">
                            <span>Notificações</span>
                            <button type="button" class="notification-clear" data-notif-limpar hidden>Marcar como lidas</button>
                        </div>
                        <div class="notification-list" data-notif-lista>
                            <div class="notification-empty">Carregando…</div>
                        </div>
                        <a class="notification-footer" th:href="@{/extrato}">Ver extrato completo <i class="bi bi-chevron-right"></i></a>
                    </div>
                </div>
                <a th:href="@{/perfil}" class="d-flex align-items-center gap-2 text-decoration-none ps-2" style="border-left:1px solid var(--border-color);">
                    <div class="user-avatar" th:text="${usuario.iniciais}">CT</div>
                    <span class="nav-username small d-none d-md-inline"
                          th:text="${usuario.primeiroNome}">Cliente</span>
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-metal" title="Sair">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- LOGO: ícone de terminal em caixa esmeralda -->
<span th:fragment="logo(size)" class="awos-logo" role="img" aria-label="AWOS Bank">
    <span class="logo-box" th:style="'width:'+${size}+'px;height:'+${size}+'px;font-size:'+${size * 0.55}+'px'">
        <i class="bi bi-terminal-fill"></i>
    </span>
</span>

<!-- TOASTS -->
<div th:fragment="toasts">
    <div id="toast-container" class="toast-container"></div>
    <div th:if="${sucesso}" data-flash th:attr="data-flash=${sucesso}" data-flash-tipo="sucesso" style="display:none"></div>
    <div th:if="${erro}"    data-flash th:attr="data-flash=${erro}"    data-flash-tipo="erro"    style="display:none"></div>
</div>

<!-- RODAPÉ -->
<footer th:fragment="footer" class="site-footer">
    <div class="container d-flex flex-column flex-sm-row align-items-center justify-content-between gap-2">
        <div>© 2026 AWOS BANK Inc. Todos os direitos reservados.</div>
        <div class="d-flex align-items-center gap-3">
            <span class="ok">&gt; backend_ok</span><span>•</span><span class="ok">&gt; database_online</span>
        </div>
    </div>
</footer>
</body>
</html>
