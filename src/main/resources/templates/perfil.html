<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar(${usuario}, 'perfil')}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>

<div class="container my-4" style="max-width:680px;">
    <div class="card">
        <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div style="width:64px;height:64px;border-radius:50%;
                            background:linear-gradient(135deg,#0d6efd,#6610f2);
                            display:flex;align-items:center;justify-content:center;
                            color:#fff;font-weight:700;font-size:1.4rem;"
                     th:text="${usuario.iniciais}">CT</div>
                <div>
                    <h4 class="fw-bold mb-0" th:text="${usuario.nomeCompleto}"></h4>
                    <small class="text-muted">
                        CPF/CNPJ: <span th:text="${usuario.cpfCnpj}"></span>
                    </small>
                </div>
            </div>

            <div th:if="${erro}" class="alert alert-danger py-2 small" th:text="${erro}"></div>

            <form th:action="@{/perfil}" th:object="${perfilDTO}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nome completo</label>
                    <input type="text" th:field="*{nomeCompleto}" class="form-control"
                           th:classappend="${#fields.hasErrors('nomeCompleto')}?'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nomeCompleto}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">E-mail</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')}?'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Telefone</label>
                        <input type="text" th:field="*{telefone}" class="form-control"
                               placeholder="(11) 91234-5678">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Data de nascimento</label>
                        <input type="date" th:field="*{dataNascimento}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Endereço</label>
                        <input type="text" th:field="*{endereco}" class="form-control"
                               placeholder="Rua, número, cidade">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-check2-circle me-1"></i> Salvar alterações
                </button>
            </form>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body p-4">
            <h6 class="fw-bold mb-3 text-uppercase small"
                style="letter-spacing:1px;color:var(--text-muted);">Dados da conta</h6>
            <dl class="row mb-0 small">
                <dt class="col-5">Agência</dt><dd class="col-7" th:text="${usuario.conta.agencia}"></dd>
                <dt class="col-5">Conta</dt><dd class="col-7" th:text="${usuario.conta.numeroConta}"></dd>
                <dt class="col-5">Tipo</dt><dd class="col-7" th:text="${usuario.conta.tipoConta.descricao}"></dd>
                <dt class="col-5">Status</dt>
                <dd class="col-7">
                    <span class="badge bg-success" th:text="${usuario.conta.status.descricao}"></span>
                </dd>
                <dt class="col-5">Abertura</dt>
                <dd class="col-7" th:text="${#temporals.format(usuario.conta.dataAbertura,'dd/MM/yyyy')}"></dd>
            </dl>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
