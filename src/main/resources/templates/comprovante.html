<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprovante · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width:560px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center text-success mb-1">✅ Comprovante</h4>
            <p class="text-center text-muted small" th:text="${t.comprovanteCodigo}"></p>
            <hr>
            <dl class="row mb-0">
                <dt class="col-5">Tipo</dt>
                <dd class="col-7" th:text="${t.tipo.descricao}"></dd>

                <dt class="col-5">Valor</dt>
                <dd class="col-7 fw-bold" th:text="${@formatador.moeda(t.valor)}"></dd>

                <dt class="col-5">Data</dt>
                <dd class="col-7" th:text="${#temporals.format(t.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></dd>

                <dt class="col-5" th:if="${t.contaOrigem != null}">Conta origem</dt>
                <dd class="col-7" th:if="${t.contaOrigem != null}"
                    th:text="${t.contaOrigem.agencia} + ' / ' + ${t.contaOrigem.numeroConta}"></dd>

                <dt class="col-5" th:if="${t.contaDestino != null}">Conta destino</dt>
                <dd class="col-7" th:if="${t.contaDestino != null}"
                    th:text="${t.contaDestino.agencia} + ' / ' + ${t.contaDestino.numeroConta}"></dd>
            </dl>
            <hr>
            <a th:href="@{/dashboard}" class="btn btn-primary w-100">Voltar ao início</a>
        </div>
    </div>
</div>
</body>
</html>
