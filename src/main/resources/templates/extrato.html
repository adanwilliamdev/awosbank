<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Extrato · AWOS Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🏦 AWOS Bank</a>
        <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-light">Voltar</a>
    </div>
</nav>

<div class="container my-4">
    <h4 class="fw-bold mb-3">Extrato da conta</h4>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <form th:action="@{/extrato}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Data início</label>
                    <input type="date" name="dataInicio" class="form-control" th:value="${filtro.dataInicio}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Data fim</label>
                    <input type="date" name="dataFim" class="form-control" th:value="${filtro.dataFim}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Tipo</label>
                    <select name="tipo" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t.descricao}"
                                th:selected="${filtro.tipo == t.name()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th class="text-end">Valor</th>
                        <th>Comprovante</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(transacoes)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhuma movimentação no período.</td>
                    </tr>
                    <tr th:each="v : ${transacoes}">
                        <td th:text="${#temporals.format(v.transacao.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${v.descricao}"></td>
                        <td th:text="${v.transacao.tipo.descricao}"></td>
                        <td class="text-end fw-bold"
                            th:classappend="${v.entrada} ? 'text-success' : 'text-danger'">
                            <span th:text="${v.entrada} ? '+ ' : '- '"></span>
                            <span th:text="${@formatador.moeda(v.transacao.valor)}"></span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-link"
                               th:href="@{'/comprovante/' + ${v.transacao.comprovanteCodigo}}">ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
