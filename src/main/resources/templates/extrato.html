<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Extrato · AWOS Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="">

<div th:replace="~{fragments/layout :: navbar(${usuario}, 'extrato')}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>

<div class="container my-4">
    <h4 class="fw-bold mb-3">Extrato da conta</h4>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body p-3">
            <form th:action="@{/extrato}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">De:</label>
                    <input type="date" name="dataInicio" class="form-control"
                           th:value="${filtro.dataInicio}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Até:</label>
                    <input type="date" name="dataFim" class="form-control"
                           th:value="${filtro.dataFim}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Tipo</label>
                    <select name="tipo" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="t : ${tipos}" th:value="${t}"
                                th:text="${t.descricao}"
                                th:selected="${filtro.tipo == t.name()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="card-body p-4">
            <div th:if="${#lists.isEmpty(transacoes)}" class="empty-state">
                <i class="bi bi-file-earmark-x"></i>
                <p>Nenhuma movimentação no período</p>
                <small>Ajuste os filtros para ver mais resultados.</small>
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(transacoes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr>
                        <th>Data</th><th>Descrição</th><th>Tipo</th>
                        <th class="text-end">Valor</th><th></th>
                    </tr></thead>
                    <tbody>
                    <tr th:each="v : ${transacoes}">
                        <td th:text="${#temporals.format(v.transacao.dataHora,'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span class="mov-icone" th:classappend="${v.entrada}?'entrada':'saida'">
                                    <i class="bi" th:classappend="${v.entrada}?'bi-arrow-down-left':'bi-arrow-up-right'"></i>
                                </span>
                                <span th:text="${v.descricao}"></span>
                            </div>
                        </td>
                        <td><span class="badge badge-tipo"
                                  
                                  th:text="${v.transacao.tipo.descricao}"></span></td>
                        <td class="text-end fw-bold"
                            th:classappend="${v.entrada}?'text-success':'text-danger'">
                            <span th:text="${v.entrada}?'+ ':'- '"></span>
                            <span th:text="${@formatador.moeda(v.transacao.valor)}"></span>
                        </td>
                        <td>
                            <button type="button" class="recibo-btn"
                                    th:attr="onclick='abrirComprovante(\''+${v.transacao.comprovanteCodigo}+'\')'"
                                    title="Ver comprovante">
                                <i class="bi bi-receipt"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL COMPROVANTE (reaproveita o mesmo ID de dashboard) -->
<div class="modal fade" id="modalComprovante" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">✅ Comprovante</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <dl class="row mb-0">
                    <dt class="col-5 text-muted small">Código</dt><dd class="col-7 fw-semibold" id="cmp-codigo"></dd>
                    <dt class="col-5 text-muted small">Tipo</dt><dd class="col-7" id="cmp-tipo"></dd>
                    <dt class="col-5 text-muted small">Valor</dt><dd class="col-7 fw-bold" id="cmp-valor"></dd>
                    <dt class="col-5 text-muted small">Data</dt><dd class="col-7" id="cmp-data"></dd>
                    <dt class="col-5 text-muted small">Origem</dt><dd class="col-7" id="cmp-origem"></dd>
                    <dt class="col-5 text-muted small">Destino</dt><dd class="col-7" id="cmp-destino"></dd>
                </dl>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-metal w-100" id="cmp-imprimir">
                    <i class="bi bi-printer me-1"></i> Imprimir / PDF
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
