<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transferência · AWOS Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="">
<nav class="navbar navbar-expand-lg navbar-awos">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}"><span th:replace="~{fragments/layout :: logo(32)}"></span><span class="brand-text">AWOS<span class="brand-sub">BANK</span></span></a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-metal">Voltar</a>
        </div>
    </div>
</nav>

<div class="container my-4" style="max-width:620px;">
    <div class="card ">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-3">Nova transferência</h4>
            <p class="text-muted small">
                Saldo disponível: <strong th:text="${@formatador.moeda(conta.saldo)}"></strong>
            </p>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>

            <form th:action="@{/transferencia}" th:object="${transferenciaDTO}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select th:field="*{tipo}" class="form-select">
                        <option value="PIX">PIX</option>
                        <option value="TED">TED</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Conta destino</label>
                    <input type="text" th:field="*{numeroContaDestino}" class="form-control"
                           placeholder="Ex.: 123456-7"
                           th:classappend="${#fields.hasErrors('numeroContaDestino')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{numeroContaDestino}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" min="0.01" th:field="*{valor}" class="form-control"
                           th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{valor}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha para confirmar</label>
                    <input type="password" th:field="*{senha}" class="form-control"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                </div>

                <button class="btn btn-primary w-100" type="submit">Confirmar transferência</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
