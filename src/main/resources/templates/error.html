<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erro · AWOS Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body d-flex align-items-center">
<div class="container" style="max-width:520px;">
    <div class="card card-glass">
        <div class="card-body p-4 text-center">
            <div class="auth-logo-box danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <h4 class="fw-bold text-danger" th:text="${titulo} ?: 'Não foi possível concluir'"></h4>
            <p class="text-muted small" th:text="${mensagem} ?: 'Algo deu errado.'"></p>
            <p class="text-muted small" th:if="${codigoErro}">Código do erro: <span class="mono" th:text="${codigoErro}"></span></p>
            <a th:href="@{/dashboard}" class="btn btn-primary">Voltar ao início</a>
        </div>
    </div>
</div>
</body>
</html>
