<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIX · AWOS Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-shell">

<div th:replace="~{fragments/layout :: navbar(${usuario}, 'pix')}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>

<div class="container my-4" style="max-width:760px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Minhas chaves PIX</h4>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovaChave">
            <i class="bi bi-plus-circle me-1"></i> Nova chave
        </button>
    </div>

    <div class="d-flex flex-column gap-3">
        <div>
            <div id="listaChaves" class="d-flex flex-column gap-3"></div>
            <div id="semChaves" class="empty-state d-none">
                <i class="bi bi-qr-code"></i>
                <p>Nenhuma chave PIX cadastrada</p>
                <small>Cadastre uma chave para receber transferências PIX.</small>
            </div>
        </div>
        <div class="pix-security">
            <i class="bi bi-terminal-fill"></i>
            <div><strong>&gt; Segurança PIX ativa</strong>Suas chaves ficam protegidas e todo o tráfego é cifrado em TLS.</div>
        </div>
    </div>
</div>

<!-- MODAL NOVA CHAVE -->
<div class="modal fade" id="modalNovaChave" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-semibold"><i class="bi bi-qr-code text-accent"></i> Nova chave PIX</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select id="pix-tipo" class="form-select">
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}"></option>
                    </select>
                </div>
                <div class="mb-1">
                    <label class="form-label">Chave</label>
                    <input id="pix-chave" type="text" class="form-control"
                           placeholder="Digite a chave (em branco = gerar chave aleatória)">
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-primary w-100" onclick="adicionarChave()">
                    <i class="bi bi-check2-circle me-1"></i> Cadastrar
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    async function carregarChaves() {
        const lista = document.getElementById('listaChaves');
        const sem = document.getElementById('semChaves');
        lista.innerHTML = '';
        const res = await fetch('/api/pix/keys');
        const chaves = await res.json();

        if (!chaves.length) { sem.classList.remove('d-none'); return; }
        sem.classList.add('d-none');

        chaves.forEach(k => {
            const card = document.createElement('div');
            card.className = 'pix-key-card';
            // Monta o card via DOM + textContent: a chave PIX é dado do usuário (anti-XSS)
            const info = document.createElement('div');
            const tipoEl = document.createElement('div');
            tipoEl.className = 'pix-key-tipo';
            tipoEl.textContent = k.tipoDescricao;
            const chaveEl = document.createElement('div');
            chaveEl.className = 'fw-semibold';
            chaveEl.textContent = k.chave;
            info.append(tipoEl, chaveEl);

            const actions = document.createElement('div');
            actions.className = 'pix-actions';

            const copy = document.createElement('button');
            copy.className = 'btn btn-sm btn-outline-metal d-flex align-items-center gap-1';
            copy.innerHTML = '<i class="bi bi-copy"></i> Copiar'; // HTML estático, sem dados externos
            copy.onclick = async () => {
                try { await navigator.clipboard.writeText(k.chave); } catch (e) { toast('Não foi possível copiar', 'erro'); return; }
                copy.innerHTML = '<i class="bi bi-check2 text-accent"></i> Copiado!';
                setTimeout(() => { copy.innerHTML = '<i class="bi bi-copy"></i> Copiar'; }, 2000);
            };

            const btn = document.createElement('button');
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.title = 'Remover';
            btn.innerHTML = '<i class="bi bi-trash"></i>'; // HTML estático, sem dados externos
            btn.onclick = async () => {
                if (!confirm('Remover esta chave PIX?')) return;
                const r = await deleteJson('/api/pix/keys/' + k.id);
                if (r.ok) { toast(r.mensagem, 'sucesso'); carregarChaves(); }
                else toast(r.mensagem || 'Erro', 'erro');
            };
            actions.append(copy, btn);
            card.append(info, actions);
            lista.appendChild(card);
        });
    }

    async function adicionarChave() {
        const tipo = document.getElementById('pix-tipo').value;
        const chave = document.getElementById('pix-chave').value.trim();
        if (!chave && tipo !== 'ALEATORIA') { toast('Informe a chave', 'erro'); return; }
        const r = await postJson('/api/pix/keys', { tipo, chave });
        if (r.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalNovaChave')).hide();
            document.getElementById('pix-chave').value = '';
            toast(r.mensagem, 'sucesso');
            carregarChaves();
        } else toast(r.mensagem, 'erro');
    }

    carregarChaves();
</script>
</body>
</html>
